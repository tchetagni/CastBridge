# Source UNIQUE des versions de CastBridge (lue par Gradle ; -Pcastbridge.versionName / -Pcastbridge.versionCode la surchargent ponctuellement).
# Règles : docs/RELEASES.md. SemVer ; « -beta » tant que le produit n'est pas livré ; versionCode strictement croissant (jamais réutilisé). Tagging : tv-<version> et phone-<version> selon docs/RELEASES.md § 13.
# CastBridge-TV : le versionCode ci-dessous est celui de la variante SANS verrou ; la variante VERROUILLÉE (-PrequireActivation=true) ajoute +1 au code et le suffixe « -verrouillee » au nom.

# CastBridge (téléphone)
phone.versionName=1.2.52-beta
phone.versionCode=82

# CastBridge-TV
# lock.graceStartMs : début ABSOLU de la grâce de la variante verrouillée (ms UTC ; 1790899200000 = 2026-10-02 00:00 UTC). Seule une installation dont PackageInfo.firstInstallTime
# est ANTÉRIEURE à cette date (parc existant) a une grâce, qui finit à lock.graceStartMs + graceDays (-Pcastbridge.graceDays, 30 par défaut) quoi qu'on fasse (réinstallation par-dessus,
# « Effacer les données »). Une installation neuve, ou désinstallée puis réinstallée, est verrouillée aussitôt. Ne jamais la reculer pour un build publié.
lock.graceStartMs=1790899200000
# lock.graceDays : durée de la grâce (jours, 0 à 365), surchargeable par -Pcastbridge.graceDays. 30 TANT QUE le parc n'est pas activé.
# D1 (décision du propriétaire) : une fois le parc activé, METTRE 0 ICI (ou -Pcastbridge.graceDays=0) puis publier une TV verrouillée : plus aucune installation n'a de grâce, y compris celles
# d'avant le verrou, qui perdent ce qui leur restait de grâce et sont verrouillées dès le lancement (une clé valide reste acceptée). Rien d'autre à changer. Détail : docs/TRIAL-EDITION.md § 16.
# Pendant la grâce, la TV applique les restrictions de l'édition d'essai (pas de « tout ouvert »), et une réinstallation sans clock.txt n'en a pas.
lock.graceDays=30
tv.versionName=0.14.44-beta
tv.versionCode=114

# CastBridge Propriétaire (console des activations, jamais publiée)
owner.versionName=0.2.4
owner.versionCode=6

# CastBridge Dev (SSH + installation, outil de développement, jamais distribué)
dev.versionName=0.1.0
dev.versionCode=1

# CastBridge serveur (backend Spring Boot, bridge.sti-cm.com) : étiquette server-<version> ; voir docs/RELEASES.md et tools/release/deploy-server.sh
server.versionName=1.2.5
server.versionCode=9
