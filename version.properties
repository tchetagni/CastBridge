# Source UNIQUE des versions de CastBridge (lue par Gradle ; -Pcastbridge.versionName / -Pcastbridge.versionCode la surchargent ponctuellement).
# Règles : docs/RELEASES.md. SemVer ; « -beta » tant que le produit n'est pas livré ; versionCode strictement croissant (jamais réutilisé).
# CastBridge-TV : le versionCode ci-dessous est celui de la variante SANS verrou ; la variante VERROUILLÉE (-PrequireActivation=true) ajoute +1 au code et le suffixe « -verrouillee » au nom.

# CastBridge (téléphone)
phone.versionName=1.2.28-beta
phone.versionCode=58

# CastBridge-TV
# lock.graceStartMs : début ABSOLU de la grâce de la variante verrouillée (ms UTC ; 1790899200000 = 2026-10-02 00:00 UTC). Seule une installation dont PackageInfo.firstInstallTime
# est ANTÉRIEURE à cette date (parc existant) a une grâce, qui finit à lock.graceStartMs + graceDays (-Pcastbridge.graceDays, 30 par défaut) quoi qu'on fasse (réinstallation par-dessus,
# « Effacer les données »). Une installation neuve, ou désinstallée puis réinstallée, est verrouillée aussitôt. Ne jamais la reculer pour un build publié.
lock.graceStartMs=1790899200000
tv.versionName=0.14.16-beta
tv.versionCode=58

# CastBridge Propriétaire (console des activations, jamais publiée)
owner.versionName=0.2.2
owner.versionCode=4

# CastBridge Dev (SSH + installation, outil de développement, jamais distribué)
dev.versionName=0.1.0
dev.versionCode=1
