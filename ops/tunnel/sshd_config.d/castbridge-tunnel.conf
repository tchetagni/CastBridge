# CastBridge : tunnels SSH inverses des CastBridge-TV (docs/REMOTE-TUNNEL.md).
# FICHIER MODÈLE : rien n'est appliqué tant que ops/tunnel/setup.sh --apply n'a pas été lancé par le propriétaire.
# Destination : /etc/ssh/sshd_config.d/castbridge-tunnel.conf (OpenSSH >= 8.2 ; PermitListen demande >= 7.8).
# Vérifier AVANT de recharger :  sshd -t   puis   systemctl reload ssh   (garder une session root ouverte).
#
# Écoute : le sshd de la machine écoute DÉJÀ sur 22 (administration du serveur). Il doit écouter AUSSI sur 2200
# (port des tunnels et des experts). Si /etc/ssh/sshd_config ne contient aucune ligne « Port », ajouter
#     Port 22
#     Port 2200
# (une seule ligne « Port 2200 » SEULE retirerait le port 22 : ne pas le faire). Ou, mieux, utiliser « systemctl edit ssh.socket » si le socket-activation est employé.

# --- Deux comptes sans shell, sans mot de passe, réservés au port 2200 -------------------------------------------
#   cbtunnel : le compte que les TV utilisent (un seul compte, une clé SSH par TV, une ligne par TV dans authorized_keys)
#   cbexpert : le compte des experts et du propriétaire (une clé par expert, ou par appareil de l'expert)
# Sur le port 22 ces comptes sont refusés ; sur le port 2200 seuls ces comptes sont acceptés.

Match LocalPort 22 User cbtunnel,cbexpert
    DenyUsers cbtunnel cbexpert

Match LocalPort 2200
    AllowUsers cbtunnel cbexpert

# --- Les TV : tunnel inverse (ssh -R) vers SON port, rien d'autre ----------------------------------------------
# Les clés sont lues par AuthorizedKeysCommand (le fichier est écrit par le backend, dans un volume Docker :
# son propriétaire n'a pas d'importance, contrairement à AuthorizedKeysFile + StrictModes).
# Chaque ligne du fichier porte déjà : restrict,port-forwarding,permitlisten="127.0.0.1:<port>",command="/bin/false"
# Ici, les garde-fous globaux du compte (ceinture ET bretelles : une ligne mal écrite ne doit jamais ouvrir plus).
# PermitListen 127.0.0.1:* = seules les écoutes distantes sur la boucle locale (le port exact est fixé par la ligne de chaque TV) ; GatewayPorts no = tout écoute sur 127.0.0.1 du serveur,
# jamais sur Internet. AllowTcpForwarding remote = « -R » oui, « -L » / « -D » non.
Match User cbtunnel LocalPort 2200
    AuthenticationMethods publickey
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/sbin/cb-authkeys.sh %u
    AuthorizedKeysCommandUser nobody
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding remote
    GatewayPorts no
    PermitListen 127.0.0.1:*
    PermitOpen none
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
    ForceCommand /bin/false
    ClientAliveInterval 30
    ClientAliveCountMax 3
    MaxSessions 1
    MaxAuthTries 2
    LoginGraceTime 20

# --- Les experts : rebond (ssh -J / -L) vers un port de TV, rien d'autre -----------------------------------------
# OpenSSH n'accepte PAS de plage de ports dans PermitOpen / permitopen : le serveur écrit UNE option
# permitopen="127.0.0.1:<port>" PAR TV enrôlée, dans la ligne de chaque expert (voir docs/REMOTE-TUNNEL.md, « Limites »).
# Ici on borne seulement l'adresse (127.0.0.1) ; le détail des ports est dans le fichier des experts.
Match User cbexpert LocalPort 2200
    AuthenticationMethods publickey
    AuthorizedKeysFile none
    AuthorizedKeysCommand /usr/local/sbin/cb-authkeys.sh %u
    AuthorizedKeysCommandUser nobody
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    GatewayPorts no
    PermitOpen 127.0.0.1:*
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
    ForceCommand /bin/false
    ClientAliveInterval 30
    ClientAliveCountMax 3
    MaxAuthTries 3
    LoginGraceTime 20

# Fin des blocs « Match » : toute directive ajoutée après ce fichier dans sshd_config.d/ tombe SOUS le dernier Match.
# Garder ce fichier en dernier (nom « castbridge-tunnel.conf » : ordre alphabétique) ou ajouter « Match all » dans le fichier suivant.
