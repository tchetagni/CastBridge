name: Backend
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04   # Docker available: the MySQL 8.4 Testcontainers test runs too
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify
      - name: docker compose config
        run: |
          mkdir -p secrets && touch secrets/castbridge-signing.pem
          CASTBRIDGE_DB_PASSWORD=x CASTBRIDGE_DB_ROOT_PASSWORD=x CASTBRIDGE_ADMIN_TOKEN=x docker compose config -q
      - run: docker build -t castbridge-api:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
