name: Tools (Python, vectors, content)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # se pose par job : à la RACINE d'un workflow, GitHub rejette le fichier
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements-dev.txt   # `cryptography` : test_signature_verifies (tools/tests) signe puis vérifie un catalogue de lots
      - run: sudo apt-get install -y ffmpeg
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 -m unittest discover -s tools/trial-edition
      - run: python3 -m unittest discover tools/anim
      - run: cd tools/content-validation && python3 -m unittest -q test_cbvalidate
      - run: cd tools/media-pipeline/tests && python3 -m unittest test_pipeline

  quiz-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tools/quiz-bank
      - run: python3 tools/quiz-bank/quizbank.py check

  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r tools/requirements-dev.txt
      - run: python3 tools/activation/verify_vectors.py

  content-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/content-budget/content_budget.py --quiet
      - run: python3 tools/content-budget/langues_budget.py --plan   # sans argument l'outil affiche son aide et sort en code 2 ; --plan vérifie la cohérence de content/langues/budget.json
      # content/TRIAL-MANIFEST.json n'est pas commité (c'est un produit de `select`) : on le génère dans un dossier temporaire du runner, puis on vérifie qu'il est
      # reproductible. `select` échoue si une règle de l'essai n'est plus tenue (plafond de 100 Mo, sous-catégorie vide, plancher, lot d'essai trop gros).
      - run: python3 tools/trial-edition/trial_edition.py select --out "$RUNNER_TEMP/TRIAL-MANIFEST.json" --only learn,quiz
      - run: python3 tools/trial-edition/trial_edition.py check --manifest "$RUNNER_TEMP/TRIAL-MANIFEST.json" --only learn,quiz
