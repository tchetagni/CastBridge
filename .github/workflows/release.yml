# Build de CONTRÔLE (release, variante verrouillée) : APK NON SIGNÉS, construits avec une clé de confiance
# JETABLE écrite pendant le job (sa clé privée n'existe nulle part) : aucun de ces APK ne peut activer une TV.
# Ne jamais les distribuer. La vraie construction et la signature se font sur le Mac du propriétaire (docs/RELEASES.md).
name: Release APKs (build only)
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04   # ships the Android SDK (ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }

      - name: Clé de confiance factice (build de contrôle seulement, personne ne peut activer cet APK)
        run: printf 'kid=0000000000000000 pub=%s scopes=ISSUE_TRIAL\n' "$(openssl rand -base64 32)" > "$RUNNER_TEMP/ci-trusted-keys.txt"

      - name: Build de contrôle (APK release non signés, variante verrouillée, clé factice)
        run: cd android && gradle --stacktrace :core:test :receiver:assembleRelease :sender:assembleRelease -PrequireActivation=true -PtrustedKeysFile="$RUNNER_TEMP/ci-trusted-keys.txt"

      - name: Copy APKs to output
        run: |
          mkdir -p out
          cp android/receiver/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp android/sender/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: castbridge-release-apks-NON-SIGNEES-CLE-FACTICE-NE-PAS-DISTRIBUER
          path: out/*.apk
