# Builds release APKs (unsigned, build only).
# La signature et la publication se font sur le Mac du propriétaire (docs/RELEASES.md).
name: Release APKs (build only)
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04   # ships the Android SDK (ANDROID_HOME)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.14.3 }

      - name: Build unsigned release APKs
        run: cd android && gradle --stacktrace :core:test :receiver:assembleRelease :sender:assembleRelease -PrequireActivation=true

      - name: Copy APKs to output
        run: |
          mkdir -p out
          cp android/receiver/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp android/sender/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: castbridge-release-apks-NON-VERROUILLEE-NE-PAS-DISTRIBUER
          path: out/*.apk
