<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Connexion')}"></head>
<body class="login">
<main class="login-box">
    <img class="logo" th:src="@{/admin/assets/castbridge-logo.svg}" alt="CastBridge">
    <h1><span>Administration</span></h1>
    <p class="flash err" th:if="${param.erreur}">Identifiant ou mot de passe incorrect. Après 5 échecs, le compte est verrouillé 15 minutes.</p>
    <p class="flash ok" th:if="${param.deconnexion}">Vous êtes déconnecté.</p>
    <form th:action="@{/admin/login}" method="post">
        <label>Identifiant <input type="text" name="username" autocomplete="username" required autofocus></label>
        <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required></label>
        <label>Code à 6 chiffres <small>(si la double authentification est activée sur le compte)</small>
            <input type="text" name="totp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="8"></label>
        <button type="submit">Se connecter</button>
    </form>
</main>
</body>
</html>
