# Every value can be overridden by an environment variable (12-factor): see backend/README.md.
server:
  port: 8080
  # Behind nginx: X-Forwarded-For/Proto/Host/Prefix are applied (Spring ForwardedHeaderFilter). The port is only
  # published on 127.0.0.1, so only the local nginx can set them; nginx must OVERWRITE X-Forwarded-For with
  # $remote_addr (see backend/README.md).
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CBSESSION
        http-only: true
        secure: ${CASTBRIDGE_COOKIE_SECURE:true}
        same-site: strict
      tracking-modes: cookie
  compression:
    enabled: true
    mime-types: application/json,text/csv
    min-response-size: 2048
  tomcat:
    threads:
      max: 40
      min-spare: 4
    max-swallow-size: 210MB
    connection-timeout: 30s
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: castbridge-server
  main:
    banner-mode: "off"
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${CASTBRIDGE_DB_URL:jdbc:mysql://castbridge-db:3306/castbridge?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${CASTBRIDGE_DB_USER:castbridge}
    password: ${CASTBRIDGE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      pool-name: castbridge-db
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # the schema belongs to Flyway (src/main/resources/db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Africa/Douala
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
      file-size-threshold: 1MB
      # big uploads are spooled on the APK volume, not in the small /tmp tmpfs of the container
      location: ${castbridge.storage-dir}/.multipart
  threads:
    virtual:
      enabled: false

castbridge:
  admin-token: ${CASTBRIDGE_ADMIN_TOKEN:}
  signing:
    key: ${CASTBRIDGE_SIGNING_KEY:}
    key-file: ${CASTBRIDGE_SIGNING_KEY_FILE:}
  storage-dir: ${CASTBRIDGE_STORAGE_DIR:/data/apk}
  catalog:
    bundles-file: ${CASTBRIDGE_BUNDLES_CATALOG_FILE:}
  free-content:
    file: ${CASTBRIDGE_FREE_CONTENT_FILE:}
  public-base-url: ${CASTBRIDGE_PUBLIC_BASE_URL:}
  # Online game tickets (w20-04, docs/API-SERVER.md « Ticket de jeu »): the key is a SECRET FILE (never a value here), empty = POST /api/v1/play/ticket answers 503
  play:
    ticket-key-file: ${CASTBRIDGE_PLAY_TICKET_KEY_FILE:}
    per-device-per-hour: ${CASTBRIDGE_PLAY_TICKET_PER_DEVICE_PER_HOUR:20}
  # Wallet module (W22: NDEM / MBOKO tokens, double-entry ledger, docs/coordination/DESIGN-W22-JETONS-NDEM-MBOKO-2026-10-04.md): OFF by default IN THE CODE (routes answer 404), turned on at
  # delivery by CASTBRIDGE_WALLET_ENABLED=1. The wallet key is a SECRET FILE (never a value here); empty or absent = the device routes answer 503 "Portefeuille indisponible".
  # The operating switches (stakes, transfer, convert, vouchers) live in the wallet_policy table and are ON by default.
  wallet:
    enabled: ${CASTBRIDGE_WALLET_ENABLED:false}
    key-file: ${CASTBRIDGE_WALLET_KEY_FILE:}
    previous-key-file: ${CASTBRIDGE_WALLET_PREVIOUS_KEY_FILE:}
    # public keys of the issuers of the cbx1 activations, same format as castbridge.licenses.trusted-keys: "name:<base64 raw public key>:ISSUE_TRIAL+ISSUE_PRODUCTION+…"
    trusted-keys: ${CASTBRIDGE_WALLET_TRUSTED_KEYS:}
    # optional signed revocation list (one cbx1 revocation token per line)
    revocations-file: ${CASTBRIDGE_WALLET_REVOCATIONS_FILE:}
    writes-per-minute-per-identity: ${CASTBRIDGE_WALLET_WRITES_PER_MINUTE_PER_IDENTITY:30}
    writes-per-minute-global: ${CASTBRIDGE_WALLET_WRITES_PER_MINUTE_GLOBAL:600}
  rate-limit:
    per-minute: ${CASTBRIDGE_RATE_LIMIT_PER_MINUTE:120}
    burst: ${CASTBRIDGE_RATE_LIMIT_BURST:60}
  packages:
    tv: ${CASTBRIDGE_PACKAGE_TV:castbridge.receiver}
    phone: ${CASTBRIDGE_PACKAGE_PHONE:castbridge.sender}
  quiz:
    seed: ${CASTBRIDGE_QUIZ_SEED:true}
    tombstone-days: ${CASTBRIDGE_QUIZ_TOMBSTONE_DAYS:365}
  devices:
    retention-days: ${CASTBRIDGE_DEVICE_RETENTION_DAYS:365}
    heartbeat-days: ${CASTBRIDGE_HEARTBEAT_RETENTION_DAYS:30}
    ip-days: ${CASTBRIDGE_IP_RETENTION_DAYS:30}
    crash-days: ${CASTBRIDGE_CRASH_RETENTION_DAYS:180}
    online-minutes: 15
    heartbeat-seconds: 900
  web:
    admin-user: ${CASTBRIDGE_WEB_ADMIN_USER:}
    admin-password: ${CASTBRIDGE_WEB_ADMIN_PASSWORD:}
    reset-password: ${CASTBRIDGE_WEB_ADMIN_RESET_PASSWORD:false}
  geo:
    country-header: ${CASTBRIDGE_GEO_COUNTRY_HEADER:}
    database-file: ${CASTBRIDGE_GEOIP_DB:}
  # Licence module (docs/LICENSE-ADMIN.md): OFF by default. Secrets (signing key, TOTP key, audit key) are FILES in the secrets
  # folder, never values in this file.
  licenses:
    enabled: ${CASTBRIDGE_LICENSES_ENABLED:false}
    public-routes: ${CASTBRIDGE_LICENSES_PUBLIC_ROUTES:false}
    trial-issuance: ${CASTBRIDGE_LICENSES_TRIAL_ISSUANCE:manual}
    secrets-dir: ${CASTBRIDGE_LICENSES_SECRETS_DIR:/run/secrets}
    signing-key-file: ${CASTBRIDGE_LICENSES_SIGNING_KEY_FILE:license-signing.key}
    totp-key: ${CASTBRIDGE_LICENSES_TOTP_KEY:}
    require-totp: ${CASTBRIDGE_LICENSES_REQUIRE_TOTP:true}
    default-grace-days: ${CASTBRIDGE_LICENSES_DEFAULT_GRACE_DAYS:14}
    default-transfer-cap: ${CASTBRIDGE_LICENSES_DEFAULT_TRANSFER_CAP:0}
    # public keys of the offline tools trusted to sign registry events, WITH their scopes (docs/ACTIVATION-FORMAT.md § 2):
    # "desktop:<base64 raw public key>:ISSUE_TRIAL+ISSUE_PRODUCTION+TRANSFER+REVOKE+REGISTRY,phone:<base64>:…"; an entry without scopes is ignored
    trusted-keys: ${CASTBRIDGE_LICENSES_TRUSTED_KEYS:}
    # installation window of an activation issued by the server, in hours (1 to 48): a code is valid 48 h from its creation
    window-hours: ${CASTBRIDGE_LICENSES_WINDOW_HOURS:48}
    max-import-bytes: ${CASTBRIDGE_LICENSES_MAX_IMPORT_BYTES:5000000}
    max-import-entries: ${CASTBRIDGE_LICENSES_MAX_IMPORT_ENTRIES:5000}
    burst-per10-min: ${CASTBRIDGE_LICENSES_BURST_PER_10_MIN:10}

  # Optional AI layer of the phone's library assistant (POST /api/v1/library/suggest, docs/LIBRARY-AGENT.md).
  # No key = no model: the endpoint answers available:false and calls nothing. NEVER put a key in this file.
  library:
    llm-api-key: ${CASTBRIDGE_LIBRARY_LLM_API_KEY:}
    # anthropic (Messages API, default) or openai (any OpenAI-compatible chat completions service)
    provider: ${CASTBRIDGE_LIBRARY_LLM_PROVIDER:anthropic}
    # empty = the usual endpoint of the provider
    llm-url: ${CASTBRIDGE_LIBRARY_LLM_URL:}
    llm-model: ${CASTBRIDGE_LIBRARY_LLM_MODEL:}
    per-hour: ${CASTBRIDGE_LIBRARY_SUGGEST_PER_HOUR:30}
    max-items: ${CASTBRIDGE_LIBRARY_SUGGEST_MAX_ITEMS:40}
    # versioned prompt: library/prompts/suggest-<version>.txt (v1 = default, v2 = with rules and examples)
    prompt-version: ${CASTBRIDGE_LIBRARY_PROMPT_VERSION:v1}
    # USD per million tokens of the model in use (default: Claude Haiku 4.5), to estimate the cost of an analysis
    price-in-per-mtok: ${CASTBRIDGE_LIBRARY_PRICE_IN_PER_MTOK:1.0}
    price-out-per-mtok: ${CASTBRIDGE_LIBRARY_PRICE_OUT_PER_MTOK:5.0}
    # estimated spending allowed per UTC day for the whole server, and names per device and day
    daily-budget-usd: ${CASTBRIDGE_LIBRARY_DAILY_BUDGET_USD:2.0}
    per-device-daily-items: ${CASTBRIDGE_LIBRARY_DEVICE_DAILY_ITEMS:300}
    max-output-tokens: ${CASTBRIDGE_LIBRARY_MAX_OUTPUT_TOKENS:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

# Actuator on a separate port that is NOT published by docker-compose: health for the Docker healthcheck only.
management:
  server:
    port: ${CASTBRIDGE_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# JSON logs: the Docker image sets LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (Elastic Common Schema); plain text otherwise.
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
